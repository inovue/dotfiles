---
- name: Assert supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - (ansible_facts['distribution_major_version'] | int) >= 24
    fail_msg: >-
      This playbook targets Ubuntu 24.04+. Got
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    success_msg: "Ubuntu {{ ansible_facts['distribution_version'] }} OK"
  tags: always

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120

# Leftover from older machines that used the gierens eza PPA.
- name: Remove leftover third-party eza apt source
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/gierens.list
    - /etc/apt/keyrings/gierens.gpg

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - curl
      - wget
      - tar
      - gzip
      - unzip
      - gpg
      - jq
      - stow
      - ffmpeg
      - bat
      - ripgrep
      - fd-find
      - fzf
      - btop
      - git-delta
      - eza
      - libatomic1
      - libvips-tools
      # terminal-browser (Electron / kitty graphics) runtime
      - fonts-liberation
      - fonts-noto-cjk
      - fonts-noto-color-emoji
      - xdg-utils
      - libasound2t64
      - libatk-bridge2.0-0t64
      - libatk1.0-0t64
      - libatspi2.0-0t64
      - libcairo2
      - libcups2t64
      - libdbus-1-3
      - libdrm2
      - libfontconfig1
      - libgbm1
      - libgdk-pixbuf-2.0-0
      - libglib2.0-0t64
      - libgtk-3-0t64
      - libnspr4
      - libnss3
      - libnss3-tools
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libvulkan1
      - libx11-xcb1
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxkbcommon0
      - libxrandr2
      - libxrender1
      - libxshmfence1
      - libxss1
      - libxtst6
    state: present
    dpkg_options: force-confdef,force-confold
    lock_timeout: 120

- name: Ensure home config and tool-pins directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/.config"
    - "{{ home }}/.config/inovue"
    - "{{ home }}/.config/inovue/tool-pins"
    - "{{ home }}/.local/bin"
