---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Remove leftover third-party eza apt source
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/gierens.list
    - /etc/apt/keyrings/gierens.gpg

- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - curl
      - wget
      - tar
      - gzip
      - unzip
      - gpg
      - jq
      - stow
      - ffmpeg
      - bat
      - ripgrep
      - fd-find
      - fzf
      - btop
      - git-delta
      - eza
      - libatomic1
      - wl-clipboard
      - fonts-liberation
      - fonts-noto-cjk
      - fonts-noto-color-emoji
      - xdg-utils
      - libasound2t64
      - libatk-bridge2.0-0t64
      - libatk1.0-0t64
      - libatspi2.0-0t64
      - libcairo2
      - libcups2t64
      - libdbus-1-3
      - libdrm2
      - libfontconfig1
      - libgbm1
      - libgdk-pixbuf-2.0-0
      - libglib2.0-0t64
      - libgtk-3-0t64
      - libnspr4
      - libnss3
      - libnss3-tools
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libvulkan1
      - libx11-xcb1
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxkbcommon0
      - libxrandr2
      - libxrender1
      - libxshmfence1
      - libxss1
      - libxtst6
    state: present
    dpkg_options: force-confdef,force-confold

- name: Align eza to Ubuntu archive package
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    target=$(apt-cache madison eza | awk '/archive\.ubuntu\.com/ {print $3; exit}')
    if [ -z "${target:-}" ]; then
      echo "no Ubuntu archive eza candidate; skip"
      exit 0
    fi
    installed=$(dpkg-query -W -f='${Version}' eza 2>/dev/null || true)
    if [ "$installed" != "$target" ]; then
      apt-get install -y --allow-downgrades "eza=${target}"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: eza_align
  changed_when: "'CHANGED' in eza_align.stdout"

- name: Ensure home config and tool-pins directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/.config"
    - "{{ home }}/.config/inovue"
    - "{{ home }}/.config/inovue/tool-pins"
    - "{{ home }}/.local/bin"
