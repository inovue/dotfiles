---
# Ansible provisions; Stow links. One package per app under stow/ — every
# directory there is linked (stow.sh is the single implementation; unmanaged
# conflicting files are moved to ~/.local/state/inovue/stow-backup/).

- name: Stow all packages into $HOME
  ansible.builtin.command:
    argv: ["{{ dotfiles_root }}/stow.sh", restow]
  register: stow_result
  changed_when: "'backed up' in stow_result.stdout"

# App-owned JSON (the app rewrites this file, so it cannot be a symlink):
# merge the repo fragment in, keep everything else (auth, caches, other hooks).
- name: Merge managed settings into app-owned JSON
  ansible.builtin.command:
    argv:
      - python3
      - "{{ dotfiles_root }}/scripts/json_merge.py"
      - "{{ item.target }}"
      - "{{ dotfiles_root }}/managed/{{ item.fragment }}"
  loop:
    - { target: "{{ home }}/.claude/settings.json", fragment: claude-settings.json }
  loop_control:
    label: "{{ item.fragment }}"
  register: json_merge
  changed_when: json_merge.stdout == 'CHANGED'
