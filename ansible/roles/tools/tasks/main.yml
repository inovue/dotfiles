---
- name: Install lazygit
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: lazygit
      pin: "{{ lazygit_version }}"
      become: true
      check: /usr/local/bin/lazygit --version
      cmd: |
        curl -fsSL "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_{{ lazygit_arch }}.tar.gz" \
          | tar -xz -C /usr/local/bin lazygit

- name: Install bws (Bitwarden Secrets Manager CLI)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: bws
      pin: "{{ bws_version }}"
      become: true
      check: /usr/local/bin/bws --version
      cmd: |
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/bws.zip" \
          "https://github.com/bitwarden/sdk-sm/releases/download/bws-v{{ bws_version }}/bws-{{ bws_arch }}-unknown-linux-gnu-{{ bws_version }}.zip"
        unzip -q -o "$tmp/bws.zip" -d "$tmp"
        install -m 0755 "$tmp/bws" /usr/local/bin/bws

# Only `ast-grep` — the `sg` alias would shadow /usr/bin/sg (shadow-utils).
- name: Install ast-grep
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: ast-grep
      pin: "{{ ast_grep_version }}"
      check: "{{ home }}/.local/bin/ast-grep --version"
      cmd: |
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/sg.zip" \
          "https://github.com/ast-grep/ast-grep/releases/download/{{ ast_grep_version }}/app-{{ gnu_triple }}.zip"
        unzip -q -o "$tmp/sg.zip" ast-grep -d "$tmp"
        install -m 0755 "$tmp/ast-grep" "{{ home }}/.local/bin/ast-grep"

- name: Ensure apt keyrings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add GitHub CLI GPG key
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    executable: /bin/bash

- name: Get dpkg architecture for GitHub CLI repo
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Add GitHub CLI repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    state: present
    filename: github-cli

- name: Install GitHub CLI
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
    dpkg_options: force-confdef,force-confold
    lock_timeout: 120

- name: Install glow (official GitHub .deb)
  become: true
  ansible.builtin.apt:
    deb: "https://github.com/charmbracelet/glow/releases/download/v{{ glow_version }}/glow_{{ glow_version }}_{{ glow_deb_arch }}.deb"
    state: present
    lock_timeout: 120

- name: Install trzsz (official GitHub .deb)
  become: true
  ansible.builtin.apt:
    deb: "https://github.com/trzsz/trzsz-go/releases/download/v{{ trzsz_version }}/trzsz_{{ trzsz_version }}_linux_{{ trzsz_deb_arch }}.deb"
    state: present
    lock_timeout: 120

- name: Install pinned CLI tools
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  loop:
    - name: uv
      pin: "{{ uv_pin }}"
      check: "{{ home }}/.local/bin/uv --version"
      environment:
        UV_NO_MODIFY_PATH: "1"
      cmd: curl -LsSf "https://astral.sh/uv/{{ uv_pin }}/install.sh" | sh
    - name: gh-workspace
      pin: "{{ gh_workspace_pin }}"
      check: gh extension list
      cmd: |
        gh extension remove workspace >/dev/null 2>&1 || true
        gh extension install inovue/gh-workspace --pin "v{{ gh_workspace_pin }}"
    - name: rtk
      pin: "{{ rtk_pin }}"
      check: "{{ home }}/.local/bin/rtk --version"
      environment:
        RTK_PIN: "{{ rtk_pin }}"
      cmd: bash "{{ dotfiles_root }}/scripts/setup_rtk.sh"
    - name: genmedia
      pin: "{{ genmedia_pin }}"
      check: "{{ home }}/.genmedia/bin/genmedia --version"
      environment:
        GENMEDIA_VERSION: "{{ genmedia_pin }}"
      cmd: curl -fsSL https://genmedia.sh/install | bash
    - name: terminal-browser
      pin: "{{ terminal_browser_pin }}"
      check: "{{ home }}/.local/bin/terminal-browser --version"
      environment:
        TERMINAL_BROWSER_SKIP_SETUP: "1"
      cmd: curl -fsSL "https://terminal-browser.sh/install/v/v{{ terminal_browser_pin }}" | bash
  loop_control:
    loop_var: installer
    label: "{{ installer.name }}"

- name: Install self-updating CLI tools (bootstrap only)
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  loop:
    - name: claude-code
      pin: "{{ claude_code_pin }}"
      policy: bootstrap
      check: "{{ home }}/.local/bin/claude --version"
      cmd: curl -fsSL https://claude.ai/install.sh | bash -s "{{ claude_code_pin }}"
    - name: herdr
      pin: "{{ herdr_pin }}"
      policy: bootstrap
      check: "{{ home }}/.local/bin/herdr --version"
      cmd: curl -fsSL https://herdr.dev/install.sh | sh
    - name: flyctl
      pin: "{{ flyctl_pin }}"
      policy: bootstrap
      check: "{{ home }}/.fly/bin/flyctl version"
      cmd: curl -fsSL https://fly.io/install.sh | sh -s "{{ flyctl_pin }}"
  loop_control:
    loop_var: installer
    label: "{{ installer.name }}"

- name: Install agent-browser
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: agent-browser
      pin: "{{ agent_browser_pin }}"
      check: agent-browser --version
      environment:
        AGENT_BROWSER_PIN: "{{ agent_browser_pin }}"
      cmd: bash "{{ dotfiles_root }}/scripts/setup_agent_browser.sh"
  tags: [agent-browser]

- name: Install herdr-hunk-diff plugin
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: herdr-hunkdiff
      pin: "{{ herdr_hunkdiff_pin }}"
      cmd: herdr plugin install jhochenbaum/herdr-hunk-diff -y
  tags: [herdr]

- name: Install herdr terminal-browser plugin
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: herdr-terminal-browser
      pin: "{{ terminal_browser_pin }}"
      environment:
        TERMINAL_BROWSER_SKIP_SETUP: "1"
      cmd: herdr plugin install zenbu-labs/terminal-browser/herdr-plugin --ref "v{{ terminal_browser_pin }}" -y
  tags: [herdr, terminal-browser]

- name: Install Modal CLI
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: modal
      pin: "{{ modal_pin }}"
      check: "{{ home }}/.local/bin/modal --version"
      cmd: |
        uv python install 3.12
        uv tool install --force --python 3.12 "modal=={{ modal_pin }}"
