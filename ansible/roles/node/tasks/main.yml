---
- name: Install fnm
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: fnm
      pin: "{{ fnm_pin }}"
      check: "{{ home }}/.local/share/fnm/fnm --version"
      cmd: curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell --release "v{{ fnm_pin }}"

- name: Install Node.js LTS via fnm
  ansible.builtin.shell: |
    set -euo pipefail
    eval "$(fnm env)"
    fnm install --lts
  args:
    creates: "{{ home }}/.local/share/fnm/aliases/default"
    executable: /bin/bash
  environment: "{{ agent_tool_env }}"

- name: Install hunkdiff
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: hunkdiff
      pin: "{{ hunkdiff_pin }}"
      check: hunk --version
      cmd: npm install -g "hunkdiff@{{ hunkdiff_pin }}"

- name: Install pnpm
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: pnpm
      pin: "{{ pnpm_pin }}"
      check: pnpm --version
      environment:
        SHELL: /usr/bin/zsh
        PNPM_VERSION: "{{ pnpm_pin }}"
      cmd: curl -fsSL https://get.pnpm.io/install.sh | sh -

- name: Install bun
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: bun
      pin: "{{ bun_pin }}"
      check: "{{ home }}/.bun/bin/bun --version"
      cmd: curl -fsSL https://bun.sh/install | bash -s "bun-v{{ bun_pin }}"

# Cloudflare Workers / Agents deploys (`wrangler login` or CLOUDFLARE_API_TOKEN).
- name: Install wrangler
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: wrangler
      pin: "{{ wrangler_pin }}"
      check: wrangler --version
      cmd: npm install -g "wrangler@{{ wrangler_pin }}"
