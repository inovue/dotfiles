---
- name: Change default shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh

- name: Install starship
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: starship
      pin: "{{ starship_pin }}"
      become: true
      check: /usr/local/bin/starship --version
      cmd: curl -fsSL https://starship.rs/install.sh | sh -s -- -y --version "v{{ starship_pin }}"

# The zoxide install script has no version flag; use the release archive.
- name: Install zoxide
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: zoxide
      pin: "{{ zoxide_version }}"
      check: "{{ home }}/.local/bin/zoxide --version"
      cmd: |
        tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "https://github.com/ajeetdsouza/zoxide/releases/download/v{{ zoxide_version }}/zoxide-{{ zoxide_version }}-{{ musl_triple }}.tar.gz" \
          | tar -xz -C "$tmp" zoxide
        install -m 0755 "$tmp/zoxide" "{{ home }}/.local/bin/zoxide"

- name: Install sheldon
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/tasks/curl_installer.yml"
  vars:
    installer:
      name: sheldon
      pin: "{{ sheldon_version }}"
      check: "{{ home }}/.local/bin/sheldon --version"
      cmd: |
        curl -fsSL "https://github.com/rossmacarthur/sheldon/releases/download/{{ sheldon_version }}/sheldon-{{ sheldon_version }}-{{ musl_triple }}.tar.gz" \
          | tar -xz -C "{{ home }}/.local/bin" sheldon
