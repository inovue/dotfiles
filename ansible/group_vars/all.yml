---
# Repo root (playbook lives in ansible/)
dotfiles_root: "{{ playbook_dir | dirname }}"
home: "{{ ansible_facts['env']['HOME'] }}"

git_user_name: "{{ ansible_facts['user_id'] }}"
git_user_email: "{{ ansible_facts['user_id'] }}@users.noreply.github.com"

# GitHub release pins (bump to upgrade)
sheldon_version: "0.8.5"
lazygit_version: "0.65.0"
bws_version: "2.1.0"
helix_version: "25.07.1"
helix_deb_revision: "25.7.1-1"

# Official install-script stamps (~/.config/inovue/tool-pins/)
starship_pin: "1.26.0"
zoxide_pin: "0.10.0"
fnm_pin: "1.39.0"
uv_pin: "0.12.9"
flyctl_pin: "0.4.97"
herdr_pin: "0.8.2"
herdr_hunkdiff_pin: "0.3.0"
pnpm_pin: "11.25.0"
genmedia_pin: "0.7.0"
cursor_agent_pin: "2026.09.02-c22c1a3"

# GNU Stow packages under stow/ (one app each; mirrors $HOME)
stow_packages:
  - zsh
  - starship
  - sheldon
  - helix
  - herdr
  - bin
