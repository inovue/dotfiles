---
# Repo root (playbook lives in ansible/)
dotfiles_root: "{{ playbook_dir | dirname }}"
home: "{{ ansible_facts['env']['HOME'] }}"

# Git identity. Empty = keep what ~/.gitconfig has, or derive from `gh api user`
# (login + <id>+<login>@users.noreply.github.com) once gh is authenticated.
git_user_name: ""
git_user_email: ""

# ---------------------------------------------------------------------------
# Exact pins — setup checks `<tool> --version` and (re)installs on mismatch.
# Bump to upgrade, then `./setup.sh --tags <role>`.
# ---------------------------------------------------------------------------
# GitHub release archives / .deb
sheldon_version: "0.8.5"
zoxide_version: "0.10.0"
lazygit_version: "0.65.0"
bws_version: "2.1.0"
glow_version: "3.0.0"
trzsz_version: "1.2.0"
ast_grep_version: "0.45.3"

# Official installers that accept a version
starship_pin: "1.26.0"
fnm_pin: "1.39.0"
uv_pin: "0.12.18"
pnpm_pin: "12.6.0"
bun_pin: "1.4.2"
genmedia_pin: "0.7.0"
terminal_browser_pin: "0.11.1"
agent_browser_pin: "0.38.1"
rtk_pin: "0.48.0"
gh_workspace_pin: "0.1.3"
hunkdiff_pin: "0.22.0"
modal_pin: "1.5.5"
herdr_hunkdiff_pin: "0.3.0"

# ---------------------------------------------------------------------------
# Bootstrap-only — installed when missing, then the tool updates itself
# (`claude update`, `herdr update`, flyctl auto).
# The value is only the version used for a fresh install where supported.
# ---------------------------------------------------------------------------
claude_code_pin: "2.1.285"
herdr_pin: "latest"
flyctl_pin: "0.4.107"

# Opt-in (not run by a plain ./setup.sh): ./setup.sh --tags docker
# docker group membership is root-equivalent — agents in your shell inherit it.
docker_add_user_to_group: true
