onboarding = false
# Docs: https://herdr.dev/docs/configuration/
# hunk-diff: https://github.com/jhochenbaum/herdr-hunk-diff
# terminal-browser: Ctrl+B Shift+B → terminal-browser-open
#   native → herdr plugin open-split | WSL → tb-split (windows/wezterm/)

[theme]
name = "catppuccin"

[ui]
mouse_capture = true
copy_on_select = true
# Drawn cursor hides the OS IME anchor → JP/CJK composition breaks (esp. WSL/Windows).
host_cursor = "native"

[keys]
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "terminal-browser-open"
description = "terminal-browser"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[terminal]
kitty_graphics = true

[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_cursor_shape = "bar"
