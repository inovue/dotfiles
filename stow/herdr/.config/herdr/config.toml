onboarding = false
# Docs: https://herdr.dev/docs/configuration/
# hunk-diff keys: https://github.com/jhochenbaum/herdr-hunk-diff
# terminal-browser plugin: https://github.com/zenbu-labs/terminal-browser/tree/main/herdr-plugin

[theme]
name = "catppuccin"

[ui]
mouse_capture = true
copy_on_select = true
# WSL/Windows: drawn cursor hides the OS IME anchor → JP/CJK composition breaks.
# https://herdr.dev/docs/troubleshooting/
host_cursor = "native"

[keys]
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "terminal-browser: open right split"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[experimental]
kitty_graphics = true
# TUIs that hide the cursor (Claude Code etc.) otherwise leave IME candidates stranded.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_cursor_shape = "bar"
