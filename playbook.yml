---
- name: WSL Ubuntu CLI environment
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars:
    home: "{{ ansible_facts['env']['HOME'] }}"
    git_user_name: "{{ ansible_facts['user_id'] }}"
    git_user_email: "{{ ansible_facts['user_id'] }}@users.noreply.github.com"
    # Bump these to upgrade pinned GitHub release installs
    sheldon_version: "0.8.5"
    lazygit_version: "0.65.0"
    bws_version: "2.1.0"
    helix_version: "25.07.1"
    helix_deb_revision: "25.7.1-1"
    # Bump these stamps to re-run official install scripts (fetch upstream latest)
    starship_pin: "1.26.0"
    zoxide_pin: "0.10.0"
    fnm_pin: "1.39.0"
    uv_pin: "0.12.9"
    flyctl_pin: "0.4.97"
    herdr_pin: "0.8.2"
    pnpm_pin: "11.25.0"
    genmedia_pin: "0.7.0"
    cursor_agent_pin: "2026.09.02-c22c1a3"

  environment:
    DEBIAN_FRONTEND: noninteractive

  pre_tasks:
    - name: Set architecture facts for release installs
      set_fact:
        sheldon_arch: "{{ 'x86_64-unknown-linux-musl' if ansible_facts['architecture'] == 'x86_64' else 'aarch64-unknown-linux-musl' }}"
        lazygit_arch: "{{ 'linux_x86_64' if ansible_facts['architecture'] == 'x86_64' else 'linux_arm64' }}"
        bws_arch: "{{ 'x86_64' if ansible_facts['architecture'] == 'x86_64' else 'aarch64' }}"
      tags: always

  tasks:
    # ========================================
    # 1. APT
    # ========================================
    - name: Update apt cache
      become: true
      apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [apt]

    - name: Remove leftover third-party eza apt source
      become: true
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/gierens.list
        - /etc/apt/keyrings/gierens.gpg
      tags: [apt]

    - name: Install base packages
      become: true
      apt:
        name:
          - zsh
          - git
          - curl
          - wget
          - tar
          - gzip
          - unzip
          - gpg
          - jq
          - ffmpeg
          - bat
          - ripgrep
          - fd-find
          - fzf
          - btop
          - git-delta
          - eza
          - libatomic1  # pnpm standalone binary
          # --- WSL2/WSLg: Helix clipboard (wl-copy / wl-paste) ---
          - wl-clipboard
          # --- Fonts (mojibake / HyperFrames) ---
          - fonts-liberation
          - fonts-noto-cjk
          - fonts-noto-color-emoji
          # --- Headless Chromium / HyperFrames system libs (Ubuntu 24.04 t64) ---
          - xdg-utils
          - libasound2t64
          - libatk-bridge2.0-0t64
          - libatk1.0-0t64
          - libatspi2.0-0t64
          - libcairo2
          - libcups2t64
          - libdbus-1-3
          - libdrm2
          - libfontconfig1
          - libgbm1
          - libgdk-pixbuf-2.0-0
          - libglib2.0-0t64
          - libgtk-3-0t64
          - libnspr4
          - libnss3
          - libnss3-tools  # agent-browser / CA certutil
          - libpango-1.0-0
          - libpangocairo-1.0-0
          - libvulkan1
          - libx11-xcb1
          - libxcb1
          - libxcomposite1
          - libxdamage1
          - libxext6
          - libxfixes3
          - libxkbcommon0
          - libxrandr2
          - libxrender1
          - libxshmfence1
          - libxss1
          - libxtst6
        state: present
        dpkg_options: 'force-confdef,force-confold'
      tags: [apt]

    - name: Align eza to Ubuntu archive package
      become: true
      shell: |
        set -euo pipefail
        target=$(apt-cache madison eza | awk '/archive\.ubuntu\.com/ {print $3; exit}')
        if [ -z "${target:-}" ]; then
          echo "no Ubuntu archive eza candidate; skip"
          exit 0
        fi
        installed=$(dpkg-query -W -f='${Version}' eza 2>/dev/null || true)
        if [ "$installed" != "$target" ]; then
          apt-get install -y --allow-downgrades "eza=${target}"
          echo CHANGED
        fi
      args:
        executable: /bin/bash
      register: eza_align
      changed_when: "'CHANGED' in eza_align.stdout"
      tags: [apt]

    # ========================================
    # 2. Default shell → zsh
    # ========================================
    - name: Change default shell to zsh
      become: true
      user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/zsh
      tags: [shell]

    # ========================================
    # 3. Starship / zoxide (official installers; pin stamp)
    # ========================================
    - name: Ensure config and tool-pins directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ home }}/.config"
        - "{{ home }}/.config/inovue"
        - "{{ home }}/.config/inovue/tool-pins"
        - "{{ home }}/.local/bin"
      tags: [shell]

    - name: Install or refresh shell curl installers
      include_tasks:
        file: tasks/curl_installer.yml
        apply:
          tags: [shell]
      loop:
        - name: starship
          pin: "{{ starship_pin }}"
          become: true
          cmd: curl -sS https://starship.rs/install.sh | sh -s -- -y
        - name: zoxide
          pin: "{{ zoxide_pin }}"
          cmd: curl -sS https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | bash
      loop_control:
        loop_var: installer
      tags: [shell]

    - name: Deploy starship.toml
      copy:
        src: starship.toml
        dest: "{{ home }}/.config/starship.toml"
        mode: "0644"
      tags: [shell]

    # ========================================
    # 4. Sheldon
    # ========================================
    - name: Check installed Sheldon version
      command: "{{ home }}/.local/bin/sheldon --version"
      register: sheldon_installed
      failed_when: false
      changed_when: false
      tags: [shell]

    - name: Download Sheldon release archive
      get_url:
        url: "https://github.com/rossmacarthur/sheldon/releases/download/{{ sheldon_version }}/sheldon-{{ sheldon_version }}-{{ sheldon_arch }}.tar.gz"
        dest: "/tmp/sheldon-{{ sheldon_version }}.tar.gz"
        mode: "0644"
      when: sheldon_installed.rc != 0 or sheldon_version not in (sheldon_installed.stdout | default(''))
      tags: [shell]

    - name: Install Sheldon binary
      unarchive:
        src: "/tmp/sheldon-{{ sheldon_version }}.tar.gz"
        dest: "{{ home }}/.local/bin"
        remote_src: true
        mode: "0755"
      when: sheldon_installed.rc != 0 or sheldon_version not in (sheldon_installed.stdout | default(''))
      tags: [shell]

    - name: Ensure ~/.config/sheldon directory exists
      file:
        path: "{{ home }}/.config/sheldon"
        state: directory
        mode: "0755"
      tags: [shell]

    - name: Deploy Sheldon plugins.toml
      copy:
        src: sheldon/plugins.toml
        dest: "{{ home }}/.config/sheldon/plugins.toml"
        mode: "0644"
      tags: [shell]

    # ========================================
    # 6. lazygit
    # ========================================
    - name: Check installed lazygit version
      command: /usr/local/bin/lazygit --version
      register: lazygit_installed
      failed_when: false
      changed_when: false
      tags: [tools]

    - name: Download lazygit archive
      become: true
      get_url:
        url: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_{{ lazygit_arch }}.tar.gz"
        dest: "/tmp/lazygit-{{ lazygit_version }}.tar.gz"
        mode: "0644"
      when: lazygit_installed.rc != 0 or lazygit_version not in (lazygit_installed.stdout | default(''))
      tags: [tools]

    - name: Install lazygit
      become: true
      unarchive:
        src: "/tmp/lazygit-{{ lazygit_version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      when: lazygit_installed.rc != 0 or lazygit_version not in (lazygit_installed.stdout | default(''))
      tags: [tools]

    # ========================================
    # 7. GitHub CLI (gh)
    # ========================================
    - name: Ensure apt keyrings directory exists
      become: true
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags: [tools]

    - name: Add GitHub CLI GPG key
      become: true
      shell: |
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      args:
        creates: /etc/apt/keyrings/githubcli-archive-keyring.gpg
      tags: [tools]

    - name: Get dpkg architecture for GitHub CLI repo
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      tags: [tools]

    - name: Add GitHub CLI repository
      become: true
      apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
        state: present
        filename: github-cli
      tags: [tools]

    - name: Install GitHub CLI
      become: true
      apt:
        name: gh
        state: present
        update_cache: true
        dpkg_options: 'force-confdef,force-confold'
      tags: [tools]

    # ========================================
    # 8. Git global identity
    # ========================================
    - name: Read git global user.name
      command: git config --global --get user.name
      register: current_git_name
      failed_when: false
      changed_when: false
      tags: [shell]

    - name: Configure git global user.name
      command: git config --global user.name "{{ git_user_name }}"
      when: (current_git_name.stdout | default('')) != git_user_name
      tags: [shell]

    - name: Read git global user.email
      command: git config --global --get user.email
      register: current_git_email
      failed_when: false
      changed_when: false
      tags: [shell]

    - name: Configure git global user.email
      command: git config --global user.email "{{ git_user_email }}"
      when: (current_git_email.stdout | default('')) != git_user_email
      tags: [shell]

    # ========================================
    # 9. fnm + Node.js LTS + npm globals
    # ========================================
    - name: Install or refresh fnm
      include_tasks:
        file: tasks/curl_installer.yml
        apply:
          tags: [node]
      loop:
        - name: fnm
          pin: "{{ fnm_pin }}"
          cmd: curl -fsSL https://fnm.vercel.app/install | bash -s -- --skip-shell
      loop_control:
        loop_var: installer
      tags: [node]

    - name: Install Node.js LTS via fnm
      shell: |
        export PATH="{{ home }}/.local/share/fnm:$PATH"
        eval "$({{ home }}/.local/share/fnm/fnm env)"
        {{ home }}/.local/share/fnm/fnm install --lts
      args:
        creates: "{{ home }}/.local/share/fnm/aliases/default"
      tags: [node]

    - name: Install hunkdiff via npm
      shell: |
        export PATH="{{ home }}/.local/share/fnm:$PATH"
        eval "$({{ home }}/.local/share/fnm/fnm env)"
        npm install -g hunkdiff
      args:
        creates: "{{ home }}/.local/share/fnm/aliases/default/bin/hunk"
      tags: [node]

    # ========================================
    # 9b. agent-browser (Vercel Labs) + Cursor skill
    # Linux system deps: section 1 Chromium apt libs + libnss3-tools
    # (become_user/apt split avoided; install --with-deps not used).
    # ========================================
    - name: Install agent-browser via npm
      shell: |
        export PATH="{{ home }}/.local/share/fnm:$PATH"
        eval "$({{ home }}/.local/share/fnm/fnm env)"
        npm install -g agent-browser
      args:
        creates: "{{ home }}/.local/share/fnm/aliases/default/bin/agent-browser"
      tags: [node]

    - name: Install agent-browser Chrome for Testing
      shell: |
        export PATH="{{ home }}/.local/share/fnm:$PATH"
        eval "$({{ home }}/.local/share/fnm/fnm env)"
        agent-browser install
      args:
        creates: "{{ home }}/.agent-browser/browsers"
      tags: [node]

    - name: Install agent-browser skill globally for Cursor
      shell: |
        export PATH="{{ home }}/.local/share/fnm:$PATH"
        eval "$({{ home }}/.local/share/fnm/fnm env)"
        npx -y skills add vercel-labs/agent-browser -g -a cursor -s agent-browser -y
      args:
        # skills CLI canonical path is ~/.agents/skills (Cursor discovers it from there)
        creates: "{{ home }}/.agents/skills/agent-browser/SKILL.md"
      tags: [node]

    # ========================================
    # 10. HyperFrames (Chrome Headless Shell; separate from agent-browser)
    # ========================================
    - name: Ensure HyperFrames Chrome Headless Shell
      shell: |
        export PATH="{{ home }}/.local/share/fnm:$PATH"
        eval "$({{ home }}/.local/share/fnm/fnm env)"
        npx hyperframes browser ensure
      args:
        creates: "{{ home }}/.cache/hyperframes/chrome"
      tags: [node]

    # ========================================
    # 10b. Helix editor (official GitHub release) + WSLg clipboard
    # ========================================
    - name: Install Helix on x86_64 (official GitHub .deb)
      become: true
      apt:
        deb: "https://github.com/helix-editor/helix/releases/download/{{ helix_version }}/helix_{{ helix_deb_revision }}_amd64.deb"
        state: present
      when: ansible_facts['architecture'] in ["x86_64", "amd64"]
      tags: [tools]

    - name: Ensure /opt/helix exists on ARM64
      become: true
      file:
        path: /opt/helix
        state: directory
        mode: "0755"
      when: ansible_facts['architecture'] == "aarch64"
      tags: [tools]

    - name: Check installed Helix version on ARM64
      command: /usr/local/bin/hx --version
      register: helix_arm_installed
      failed_when: false
      changed_when: false
      when: ansible_facts['architecture'] == "aarch64"
      tags: [tools]

    - name: Install Helix on ARM64 (official tarball)
      become: true
      unarchive:
        src: "https://github.com/helix-editor/helix/releases/download/{{ helix_version }}/helix-{{ helix_version }}-aarch64-linux.tar.xz"
        dest: /opt/helix
        remote_src: true
        extra_opts: [--strip-components=1]
      when: >
        ansible_facts['architecture'] == "aarch64"
        and (helix_arm_installed.rc != 0
             or helix_version not in (helix_arm_installed.stdout | default('')))
      tags: [tools]

    - name: Symlink hx into PATH on ARM64
      become: true
      file:
        src: /opt/helix/hx
        dest: /usr/local/bin/hx
        state: link
      when: ansible_facts['architecture'] == "aarch64"
      tags: [tools]

    - name: Ensure ~/.config/helix directory exists
      file:
        path: "{{ home }}/.config/helix"
        state: directory
        mode: "0755"
      tags: [tools]

    - name: Deploy Helix config.toml
      copy:
        src: helix/config.toml
        dest: "{{ home }}/.config/helix/config.toml"
        mode: "0644"
      tags: [tools]

    # ========================================
    # 11. uv + Modal CLI (Python 3.12)
    # ========================================
    - name: Install or refresh tool curl installers
      include_tasks:
        file: tasks/curl_installer.yml
        apply:
          tags: [tools]
      loop:
        - name: uv
          pin: "{{ uv_pin }}"
          cmd: curl -LsSf https://astral.sh/uv/install.sh | sh
        - name: flyctl
          pin: "{{ flyctl_pin }}"
          cmd: curl -L https://fly.io/install.sh | sh
        - name: cursor-agent
          pin: "{{ cursor_agent_pin }}"
          cmd: curl -fsSL https://cursor.com/install | bash
        - name: genmedia
          pin: "{{ genmedia_pin }}"
          cmd: |
            export PATH="{{ home }}/.local/bin:$PATH"
            curl -fsSL https://genmedia.sh/install | bash
        - name: herdr
          pin: "{{ herdr_pin }}"
          cmd: curl -fsSL https://herdr.dev/install.sh | sh
      loop_control:
        loop_var: installer
      tags: [tools]

    - name: List installed uv Python versions
      command: "{{ home }}/.local/bin/uv python list --only-installed"
      register: uv_py_list
      changed_when: false
      failed_when: false
      tags: [tools]

    - name: Ensure Python 3.12 for Modal CLI
      command: "{{ home }}/.local/bin/uv python install 3.12"
      when: uv_py_list.rc != 0 or ('3.12' not in (uv_py_list.stdout | default('')))
      tags: [tools]

    - name: Install Modal CLI via uv
      shell: "{{ home }}/.local/bin/uv tool install modal --python 3.12"
      args:
        creates: "{{ home }}/.local/bin/modal"
      tags: [tools]

    # ========================================
    # 11c. bws (Bitwarden Secrets Manager CLI)
    # ========================================
    - name: Check installed bws version
      command: /usr/local/bin/bws --version
      register: bws_installed
      failed_when: false
      changed_when: false
      tags: [tools]

    - name: Download bws archive
      become: true
      get_url:
        url: "https://github.com/bitwarden/sdk-sm/releases/download/bws-v{{ bws_version }}/bws-{{ bws_arch }}-unknown-linux-gnu-{{ bws_version }}.zip"
        dest: "/tmp/bws-{{ bws_version }}.zip"
        mode: "0644"
      when: bws_installed.rc != 0 or bws_version not in (bws_installed.stdout | default(''))
      tags: [tools]

    - name: Install bws
      become: true
      unarchive:
        src: "/tmp/bws-{{ bws_version }}.zip"
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
      when: bws_installed.rc != 0 or bws_version not in (bws_installed.stdout | default(''))
      tags: [tools]

    # ========================================
    # 11g. pnpm
    # ========================================
    - name: Install or refresh pnpm
      include_tasks:
        file: tasks/curl_installer.yml
        apply:
          tags: [node]
      loop:
        - name: pnpm
          pin: "{{ pnpm_pin }}"
          environment:
            SHELL: /usr/bin/zsh
          cmd: curl -fsSL https://get.pnpm.io/install.sh | sh -
      loop_control:
        loop_var: installer
      tags: [node]

    # ========================================
    # 11h. Remove leftover bun (no longer used)
    # ========================================
    - name: Remove leftover bun install directory
      file:
        path: "{{ home }}/.bun"
        state: absent
      tags: [node]

    # ========================================
    # 11i. asset-generator Cursor skill
    # ========================================
    - name: Install asset-generator skill globally
      shell: bash "{{ playbook_dir }}/scripts/setup_asset_generator.sh"
      tags: [node]

    # ========================================
    # 12. WSL browser opener
    # ========================================
    - name: Deploy WSL browser opener
      copy:
        src: wsl-browser
        dest: "{{ home }}/.local/bin/wsl-browser"
        mode: "0755"
      tags: [shell]

    # ========================================
    # 13. Dotfiles (.zshenv / .zshrc)
    # ========================================
    - name: Deploy .zshenv
      copy:
        src: zshenv
        dest: "{{ home }}/.zshenv"
        mode: "0644"
      tags: [shell]

    - name: Deploy .zshrc
      copy:
        src: zshrc
        dest: "{{ home }}/.zshrc"
        mode: "0644"
      tags: [shell]

    - name: Done message
      debug:
        msg: |
          Setup complete.
          Run `exec zsh` to apply shell config.
          HyperFrames check: `npx hyperframes doctor`
      tags: always
